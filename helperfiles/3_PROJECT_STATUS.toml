# Agent State Machines
# Detailed state definitions for Admin AI, PM, and Worker agents

[agent_state_machines.admin_ai]
name = "Admin AI Agent"
description = "Primary user interface agent, orchestrates multiple parallel projects"
initial_state = "Startup"

[[agent_state_machines.admin_ai.states]]
name = "Startup"
description = "Initial state on framework launch"
actions = [
    "Analyze conversation history with user",
    "Determine current context and user state",
    "Transition to appropriate state"
]
transitions_to = ["Conversation", "Planning", "Monitoring"]

[[agent_state_machines.admin_ai.states]]
name = "Conversation"
description = "Default state for casual interaction"
actions = [
    "Respond to questions, provide information",
    "No actionable intent detected",
    "Monitor for complex/actionable intents"
]
transitions_to = ["Planning"]

[[agent_state_machines.admin_ai.states]]
name = "Planning"
description = "Complex or multi-step intent detected"
actions = [
    "Decompose user request into project plan",
    "Create: plan_title, plan_overview, plan_task_list",
    "Request framework to create project",
    "Create PM agent with project-specific system prompt",
    "Transition to Monitoring"
]
transitions_to = ["Monitoring"]

[[agent_state_machines.admin_ai.states]]
name = "Monitoring"
description = "Active when 1+ projects running"
actions = [
    "Simultaneously available for user conversation",
    "Monitor project progress",
    "Handle project status updates",
    "Intervene if projects need guidance"
]
transitions_to = ["Conversation", "Planning"]

[agent_state_machines.pm_agent]
name = "Project Manager Agent"
description = "Manages a single project, coordinates workers"
initial_state = "Startup"

[[agent_state_machines.pm_agent.states]]
name = "Startup"
description = "Receive project context from framework"
actions = [
    "Parse: project name, overview, initial tasks",
    "Analyze requirements and constraints",
    "Transition to Planning"
]
transitions_to = ["Planning"]

[[agent_state_machines.pm_agent.states]]
name = "Planning"
description = "Break down project into detailed execution plan"
actions = [
    "Break down initial tasks into detailed subtasks",
    "Create milestones with deadlines",
    "Design worker agent team (specialized roles)",
    "Define success criteria",
    "Request framework to create worker agents",
    "Transition to Manage"
]
transitions_to = ["Manage"]

[[agent_state_machines.pm_agent.states]]
name = "Manage"
description = "Active project management"
actions = [
    "Assign unassigned tasks to workers",
    "Monitor worker progress",
    "Validate worker outputs",
    "Mark tasks complete after verification",
    "Handle blockers and dependencies",
    "Report progress to Admin AI"
]
transitions_to = ["Complete", "Failed"]

[[agent_state_machines.pm_agent.states]]
name = "Complete"
description = "Project successfully finished"
actions = [
    "Final validation of deliverables",
    "Generate completion report",
    "Archive project artifacts",
    "Notify Admin AI",
    "Terminate PM and worker agents"
]
terminal = true

[[agent_state_machines.pm_agent.states]]
name = "Failed"
description = "Unrecoverable error state"
actions = [
    "Generate failure report",
    "Notify Admin AI with reasons",
    "Terminate agents"
]
terminal = true

[agent_state_machines.worker_agent]
name = "Worker Agent"
description = "Executes individual tasks using MCP tools"
initial_state = "Idle"

[[agent_state_machines.worker_agent.states]]
name = "Idle"
description = "Waiting for task assignment"
actions = ["Wait for task assignment from PM", "No active work"]
transitions_to = ["Working"]

[[agent_state_machines.worker_agent.states]]
name = "Working"
description = "Executing assigned task"
actions = [
    "Execute assigned task",
    "Use MCP tools as needed",
    "Track progress internally",
    "Handle errors and retries"
]
transitions_to = ["Reporting"]

[[agent_state_machines.worker_agent.states]]
name = "Reporting"
description = "Report work to PM for validation"
actions = [
    "Report completed work to PM",
    "Provide deliverables and artifacts",
    "Wait for PM validation"
]
transitions_to = ["Idle", "Complete"]

[[agent_state_machines.worker_agent.states]]
name = "Complete"
description = "All assigned tasks finished"
actions = ["Agent terminates"]
terminal = true

# Project Lifecycle Flow
[project_lifecycle]
description = "End-to-end flow from user intent to project completion"

[[project_lifecycle.steps]]
step = 1
action = "User expresses intent"
example = "Build me a todo app"
responsible = "User"

[[project_lifecycle.steps]]
step = 2
action = "Admin AI detects complex intent"
details = "Transition to Planning state"
responsible = "Admin AI"

[[project_lifecycle.steps]]
step = 3
action = "Admin AI creates project plan"
details = "Title, overview, initial task list"
example = "Title: 'Todo App Development', Overview: 'Create web-based todo with React', Tasks: ['Design UI', 'Implement backend', 'Test']"
responsible = "Admin AI"

[[project_lifecycle.steps]]
step = 4
action = "Framework creates Project entity"
responsible = "Framework"

[[project_lifecycle.steps]]
step = 5
action = "Admin AI creates PM agent"
details = "Generate project-specific system prompt"
responsible = "Admin AI"

[[project_lifecycle.steps]]
step = 6
action = "Framework assigns PM to project"
details = "PM transitions to Startup state"
responsible = "Framework"

[[project_lifecycle.steps]]
step = 7
action = "PM breaks down tasks and creates workers"
details = "Transition to Manage state"
responsible = "PM Agent"

[[project_lifecycle.steps]]
step = 8
action = "Workers execute tasks and report to PM"
responsible = "Worker Agents"

[[project_lifecycle.steps]]
step = 9
action = "PM validates work and marks complete"
responsible = "PM Agent"

[[project_lifecycle.steps]]
step = 10
action = "Admin notifies user, project archived"
responsible = "Admin AI"

# Data Structures
[data_structures]
description = "Core Rust structs for project management system"

[data_structures.project]
name = "Project"
description = "Represents a discrete user-requested project"
fields = [
    "id: ProjectId",
    "title: String",
    "overview: String",
    "status: ProjectStatus",
    "pm_agent_id: Option<AgentId>",
    "worker_agent_ids: Vec<AgentId>",
    "milestones: Vec<Milestone>",
    "tasks: Vec<Task>",
    "created_at: SystemTime",
    "started_at: Option<SystemTime>",
    "completed_at: Option<SystemTime>",
    "message_history: Vec<Message>"
]

[data_structures.project_status]
name = "ProjectStatus"
type = "enum"
variants = [
    "Created - Project created, PM not yet assigned",
    "Active - PM managing, workers executing",
    "Paused - User paused",
    "Completed - Successfully finished",
    "Failed - Unrecoverable error",
    "Cancelled - User cancelled"
]

[data_structures.milestone]
name = "Milestone"
description = "Project milestone with associated tasks"
fields = [
    "id: MilestoneId",
    "title: String",
    "description: String",
    "deadline: Option<SystemTime>",
    "task_ids: Vec<TaskId>",
    "status: MilestoneStatus"
]

[data_structures.task]
name = "Task"
description = "Individual work item assigned to worker"
fields = [
    "id: TaskId",
    "title: String",
    "description: String",
    "assigned_worker: Option<AgentId>",
    "dependencies: Vec<TaskId>",
    "status: TaskStatus",
    "deliverables: Vec<String>",
    "created_at: SystemTime",
    "completed_at: Option<SystemTime>"
]

[data_structures.task_status]
name = "TaskStatus"
type = "enum"
variants = [
    "Unassigned",
    "Assigned",
    "InProgress",
    "Blocked",
    "UnderReview - PM validating",
    "Complete",
    "Failed"
]

