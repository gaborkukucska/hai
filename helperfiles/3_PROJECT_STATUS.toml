# Architecture decisions
[[architecture_decisions]]
id = "AD-10"
date = "2025-10-23"
title = "STT/TTS as Core Infrastructure (Not MCP)"
decision = "STT and TTS are fundamental HAI-Net components integrated into hainet-core, not MCP servers. Designed for multi-device deployment (master-slave architecture)."
rationale = "MCP servers provide tools for LLM agents. STT/TTS are core framework features that need tight integration, offline operation, and mesh network distribution capability."
impact = "Create hainet-core/src/multimodal/ module, integrate Whisper via candle-whisper (pure Rust), support single-device or distributed deployment"
status = "implementing"
technologies = ["Candle ML framework", "Whisper model", "Rust audio processing", "Multi-device mesh"]
implementation_notes = "Can run on one device if only one available, or distributed to slaves in multi-device setup. Master coordinates STT/TTS service placement based on device capabilities."

[[architecture_decisions]]
id = "AD-9"
date = "2025-10-22"
title = "Multimodal Voice-First UI"
decision = "Portal UI prioritizes voice/video interaction over text. Admin AI speaks by default, processes webcam input, renders dynamic UI components."
rationale = "More natural human-AI interaction, leverages modern AI capabilities (STT, TTS, vision), enables testing of full system"
impact = "Requires Tauri desktop app, WebRTC integration, Whisper for STT, Piper/Coqui for TTS, llama3.2-vision for webcam"
status = "implementing"
technologies = ["Tauri", "React", "WebRTC", "Web Audio API", "Whisper (STT)", "Piper/Coqui (TTS)", "llama3.2-vision"]

[[architecture_decisions]]
id = "AD-8"
date = "2025-10-22"
title = "Project-Based Agentic System"
decision = "User requests become discrete projects with dedicated PM and Worker agents. Admin AI orchestrates multiple parallel projects."
rationale = "Scalability, isolation, clear hierarchy, dynamic agent creation"
impact = "Major architectural shift requiring new project management infrastructure"
status = "implemented"

[[architecture_decisions]]
id = "AD-7"
date = "2025-10-21"
title = "Agent Lifecycle - Hibernation vs Deletion"
decision = "Agents hibernate after project completion, deleted only when project deleted"
rationale = "Allows project resumption without losing agent context"
impact = "Requires state persistence and lifecycle management"
status = "implemented"

[[architecture_decisions]]
id = "AD-6"
date = "2025-10-20"
title = "LLM Integration Strategy"
decision = "Hybrid approach - Direct LLM calls for simple tasks, MCP for complex reasoning"
rationale = "Balance between performance and capability"
impact = "Need both direct Ollama client and MCP integration"
status = "implemented"

