# Current blockers
[[blockers]]
issue = "MCP transport lifecycle - RunningService gets dropped prematurely"
severity = "high"
impact = "Worker agents cannot access MCP tools - TransportClosed error on all tool calls"
affected_components = ["hainet-persona/src/tools/mcp/client.rs"]
details = "The rmcp::service::RunningService struct is being stored correctly but the background service task still terminates. Needs deeper understanding of rmcp SDK lifecycle model. 8/10 integration tests fail with TransportClosed error."
workaround_attempted = [
    "Storing RunningService in HashMap - still drops",
    "Using Box<dyn Any> - loses Drop behavior",
    "Spawning task with run_until_stopped() - method doesn't exist",
    "Type alias RunningService<RoleClient, MinimalClientHandler> - compiles but still drops"
]
next_steps = [
    "Study rmcp SDK examples for proper RunningService lifecycle",
    "Debug with tokio tracing to see when task terminates",
    "Consider Arc<RunningService> or different storage pattern",
    "Consult rmcp community/documentation"
]

