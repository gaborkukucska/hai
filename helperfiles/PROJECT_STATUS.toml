# Architecture decisions
[[architecture_decisions]]
id = "AD-9"
date = "2025-10-22"
title = "Multimodal Voice-First UI"
decision = "Portal UI prioritizes voice/video interaction over text. Admin AI speaks by default, processes webcam input, renders dynamic UI components."
rationale = "More natural human-AI interaction, leverages modern AI capabilities (STT, TTS, vision), enables testing of full system"
impact = "Requires Tauri desktop app, WebRTC integration, Ollama multimodal models (whisper, piper, llama3.2-vision)"
status = "implementing"
technologies = ["Tauri", "React", "WebRTC", "Web Audio API", "Ollama multimodal models"]

[[architecture_decisions]]
id = "AD-8"
date = "2025-10-22"
title = "Project-Based Agentic System"
decision = "User requests become discrete projects with dedicated PM and Worker agents. Admin AI orchestrates multiple parallel projects."
rationale = "Scalability, isolation, clear hierarchy, dynamic agent creation"
impact = "Major architectural shift requiring new project management infrastructure"
status = "implemented"

[[architecture_decisions]]
id = "AD-7"
date = "2025-10-21"
title = "Agent Lifecycle - Hibernation vs Deletion"
decision = "Agents hibernate after project completion, deleted only when project deleted"
rationale = "Allows project resumption without losing agent context"
impact = "Requires state persistence and lifecycle management"
status = "implemented"

[[architecture_decisions]]
id = "AD-6"
date = "2025-10-20"
title = "LLM Integration Strategy"
decision = "Hybrid approach - Direct LLM calls for simple tasks, MCP for complex reasoning"
rationale = "Balance between performance and capability"
impact = "Need both direct Ollama client and MCP integration"
status = "implemented"

