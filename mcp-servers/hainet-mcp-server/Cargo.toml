# START OF FILE mcp-servers/hainet-mcp-server/Cargo.toml
[package]
name = "hainet-mcp-server"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmcp = { workspace = true, features = ["server", "transport-io"] }
rmcp-macros = { workspace = true }
hainet-core = { path = "../../hainet-core" }
chrono = "0.4"
sysinfo = "0.30.12"
uuid = { version = "1.18.1", features = ["v4"] }
libp2p = "0.53.2"

[dev-dependencies]
tokio-test = "0.4.4"
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
