# START OF FILE hainet-core/Cargo.toml
[package]
name = "hainet-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "HAI-Net Core Daemon - Main networking and coordination service"

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
config = { workspace = true }
futures = { workspace = true }

# Networking
libp2p = { workspace = true }
hyper = { workspace = true }

# Storage
sled = { workspace = true }
blake3 = "1.5"
hex = "0.4"

# Crypto for identity
ed25519-dalek = { workspace = true }
sha3 = { workspace = true }

# Multimodal (STT/TTS)
base64 = "0.22"
hound = "3.5"  # WAV processing
dirs = "5.0"   # Home directory detection
which = "6.0"  # Executable detection for Piper TTS

# Whisper integration via whisper-rs (bindings to whisper.cpp)
# Note: whisper-rs compilation requires cmake and a C++ compiler
# For now, we'll implement a simpler approach using external Whisper process
# or wait for Candle ecosystem to stabilize
# 
# Alternative: Use whisper-rs when available
# whisper-rs = "0.10"
#
# For Phase 2.2 completion, we'll keep the architecture in place
# but use a placeholder that documents the integration path
# Multi-format audio decoding (WebM/Opus, MP3, etc.)
symphonia = "0.5"

[dev-dependencies]
tempfile = "3.0"
tokio-test = "0.4"

[[bin]]
name = "hainet-core"
path = "src/main.rs"
