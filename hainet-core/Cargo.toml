# START OF FILE hainet-core/Cargo.toml
[package]
name = "hainet-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "HAI-Net Core Daemon - Main networking and coordination service"

[dependencies]
