# Consensus
tendermint = { workspace = true }

# Crypto
ed25519-dalek = { workspace = true }
sha3 = { workspace = true }
bs58 = { workspace = true }
rand = { workspace = true }

# Storage
sled = { workspace = true }

[dev-dependencies]
tempfile = "3.0"
tokio-test = "0.4"

[[bin]]
name = "hainet-chain"
path = "src/main.rs"

[lib]
name = "hainet_chain"
path = "src/lib.rs"
