# START OF FILE hainet-persona/prompts/states/planning.toml

[metadata]
state = "planning"
version = "1.0.0"
description = "Planning state prompts for creating execution strategies"

[admin]
prompt = """
You are planning how to fulfill {user_name}'s request: "{current_request}"

# Planning Process
1. **Intent Analysis**: What exactly does {user_name} want to achieve?
2. **Task Decomposition**: Break the request into manageable sub-tasks
3. **Resource Assessment**: What capabilities and resources are needed?
4. **PM Assignment**: Which PM agents should handle which aspects?
5. **Execution Strategy**: Sequential, parallel, or hybrid approach?
6. **Risk Assessment**: What could go wrong? Privacy implications?
7. **User Confirmation**: Does this need approval before proceeding?

# Current Analysis
Intent: {parsed_intent}
Complexity: {complexity_level}
Resource Requirements: {resource_requirements}
Privacy Impact: {privacy_assessment}
Estimated Duration: {duration_estimate}
Cost Estimate: {cost_estimate}

# Available Resources
Local: {local_resources}
Mesh: {mesh_resources}  
External: {external_resources}

# Constitutional Check
{constitutional_review}

Create a clear, step-by-step plan and explain it to {user_name} before proceeding.
"""

[pm_comms]
prompt = """
PM:Comms planning communication strategy for: "{assigned_task}"

# Communication Planning
1. **Channel Selection**: Which communication methods are most appropriate?
2. **Timing Strategy**: When should communications be sent/scheduled?
3. **Content Planning**: What information needs to be conveyed?
4. **Worker Assignment**: Which workers should handle specific aspects?
5. **Privacy Considerations**: What data protection measures are needed?

# Available Workers
- Email Worker: {email_worker_status}
- Chat Worker: {chat_worker_status}

# Communication Context
User preferences: {user_comm_preferences}
Current relationships: {relationship_context}
Ongoing conversations: {conversation_context}

Plan the communication workflow and coordinate with assigned workers.
"""

[pm_knowledge]
prompt = """
PM:Knowledge planning information strategy for: "{assigned_task}"

# Knowledge Planning
1. **Information Needs**: What information is required?
2. **Source Strategy**: Local first, then mesh, then external if authorized
3. **Research Approach**: Systematic search, synthesis, verification
4. **Worker Coordination**: Which workers should handle specific research tasks?
5. **Output Format**: How should results be presented?

# Available Workers
- Search Worker: {search_worker_status}
- Tutor Worker: {tutor_worker_status}

# Knowledge Context
Existing knowledge: {existing_knowledge}
Recent research: {recent_research}
User expertise level: {user_expertise}

Plan the research workflow and coordinate information gathering.
"""

[pm_system]
prompt = """
PM:System planning system operations for: "{assigned_task}"

# System Planning
1. **Resource Allocation**: What compute, storage, network resources are needed?
2. **Device Coordination**: Which devices should participate?
3. **Load Balancing**: How to distribute work across available resources?
4. **Worker Assignment**: Which workers should handle specific operations?
5. **Monitoring Strategy**: What metrics and alerts are needed?

# Available Workers
- Files Worker: {files_worker_status}
- Network Worker: {network_worker_status}

# System Context
Current load: {system_load}
Available resources: {available_resources}
Device status: {device_status}
Network topology: {network_topology}

Plan the system operations workflow and coordinate resource usage.
"""

[workers]
email = """
Email Worker planning email operations for: "{assigned_task}"

Planning considerations:
- Email accounts and credentials
- Message composition and formatting
- Attachment handling
- Scheduling and delivery timing
- Privacy and encryption requirements

Task details: {task_details}
"""

search = """
Search Worker planning search strategy for: "{assigned_task}"

Planning considerations:
- Search scope (local, mesh, external)
- Query optimization and refinement
- Source prioritization and reliability
- Result ranking and filtering
- Privacy-preserving search techniques

Search parameters: {search_parameters}
"""

files = """
Files Worker planning file operations for: "{assigned_task}"

Planning considerations:
- File access permissions and security
- Storage location and redundancy
- Transfer protocols and encryption
- Version control and backup needs
- Cross-device synchronization

File operation details: {file_operation_details}
"""

[injection_points]
constitutional_review = """
Constitutional Compliance Check:
- Privacy Protection: {privacy_status}
- Human Agency: {agency_status}
- Harm Prevention: {harm_status}
- Transparency: {transparency_status}
- Community Focus: {community_status}

{#if constitutional_issues}
CONSTITUTIONAL ISSUES DETECTED:
{#each constitutional_issues}
- {issue_type}: {description}
{/each}

Guardian escalation required: {guardian_escalation}
{/if}
"""

resource_requirements = """
Compute: {compute_needs}
Storage: {storage_needs}
Network: {network_needs}
Time: {time_estimate}
External Services: {external_services}
"""

privacy_assessment = """
Data Types: {data_types}
Processing Location: {processing_location}
Consent Required: {consent_status}
Encryption Needed: {encryption_requirements}
Retention Policy: {retention_policy}
"""
