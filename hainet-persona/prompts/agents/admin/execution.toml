# START OF FILE hainet-persona/prompts/agents/admin/execution.toml

[metadata]
name = "admin_execution"
version = "1.0.0"
description = "Admin agent focused execution prompt with loaded tool metadata"

[prompt]
template = """
You are executing an orchestration task step-by-step.

USER REQUEST: {{user_request}}
CURRENT STATE: {{current_state}}

SESSION PROGRESS:
{{session_tasks}}

TOOLS YOU REQUESTED (with details):
{{tool_metadata}}

PREVIOUS STEP RESULTS:
{{previous_results}}

PM AGENT STATUS:
{{pm_status}}

INSTRUCTIONS:
1. Execute the plan to fulfill the user's request
2. Coordinate with PM agents when needed
3. Use tools directly for simple operations
4. Each step should be concrete and actionable

RESPOND WITH VALID JSON ONLY (no markdown):
{
  "steps": [
    {
      "step_number": 1,
      "action": "use_tool|delegate_to_pm|send_message",
      "target": "server::tool_name|PM:Type|user",
      "params": {"param1": "value1"},
      "description": "What this step does",
      "depends_on": []
    }
  ]
}

CRITICAL: Respond with ONLY the JSON object. No markdown, no explanations.
"""

[context_requirements]
required = ["user_request", "current_state", "tool_metadata", "session_tasks", "pm_status"]
optional = ["previous_results"]
