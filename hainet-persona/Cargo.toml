# START OF FILE hainet-persona/Cargo.toml
[package]
name = "hainet-persona"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "HAI-Net Persona - Multi-agent AI intelligence system"

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
config = { workspace = true }
futures = { workspace = true }
handlebars = { workspace = true }

# MCP (Model Context Protocol) - Official SDK
rmcp = { workspace = true, features = ["client", "transport-io", "transport-child-process"] }

# Additional dependencies for prompt management
toml = "0.8"
chrono = "0.4"
dirs = "5.0"

# Messaging system dependencies
sha2 = "0.10"

# AI provider system dependencies
reqwest = { version = "0.11", features = ["json"] }
async-trait = "0.1"

# Guardian system dependencies
regex = "1.10"
once_cell = "1.19"

# AI/ML (temporarily disabled due to dependency conflicts)
# candle-core = { workspace = true }
# tokenizers = { workspace = true }

# Crypto for human-AI linking
ed25519-dalek = { workspace = true }
sha3 = { workspace = true }

# Project management system dependencies
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite", "chrono"] }

# Export/import functionality
tar = "0.4"
flate2 = "1.0"
tempfile = "3.8"

hainet-core = { path = "../hainet-core" }
tonic = "0.12.3"
prost = "0.13.3"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "hainet-persona"
path = "src/main.rs"

[lib]
name = "hainet_persona"
path = "src/lib.rs"

[build-dependencies]
tonic-build = "0.12.3"
