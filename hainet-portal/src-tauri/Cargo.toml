[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
# Empty workspace table to keep this package out of the parent workspace

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.1", features = ["test"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
base64 = "0.21"
reqwest = { version = "0.11", features = ["json", "multipart"] }
tracing = "0.1"
tracing-appender = "0.2"
tiny_http = "0.12"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }

# HAI-Net dependencies
hainet-persona = { path = "../../hainet-persona" }
hainet-core = { path = "../../hainet-core" }
image = "0.25"
sysinfo = "0.30.12"
dirs = "5.0"

[dev-dependencies]
hound = "3.5"  # WAV file generation for tests
