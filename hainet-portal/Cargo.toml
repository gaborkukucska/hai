# START OF FILE hainet-portal/Cargo.toml
[package]
name = "hainet-portal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "HAI-Net Portal - Chat interface for AI interaction"

[dependencies]
dirs = "5.0"
chrono = "0.4"
tracing-appender = "0.2"
# Workspace dependencies
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
config = { workspace = true }
futures = { workspace = true }

# Web Server & Assets
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace", "auth"] }
rust-embed = { version = "8.0", features = ["include-exclude"] }
mime_guess = "2.0"

# Crypto & Auth
argon2 = "0.5"
jsonwebtoken = "9.2"
rand = "0.8"
bip39 = { version = "2.0", features = ["rand"] }
aes-gcm = "0.10"

# Tauri for desktop app (will be added when UI is implemented)
# tauri = { version = "2.0", features = [] }

# WebSocket for real-time communication
tungstenite = { workspace = true }

[build-dependencies]
# tauri-build = { version = "2.0", features = [] }

[dev-dependencies]
tempfile = "3.0"
tokio-test = "0.4"

[[bin]]
name = "hainet-portal"
path = "src/main.rs"

[lib]
name = "hainet_portal"
path = "src/lib.rs"
